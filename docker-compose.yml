version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: email_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    # No internal db service; using external PostgreSQL
    depends_on: []
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: email_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    # The frontend will contact backend via the same domain (proxy)

networks:
  default:
    name: email_app_network
    driver: bridge
