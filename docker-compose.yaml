version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: smartcampaign_db
    restart: always
    environment:
      POSTGRES_DB: smartcampaign
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Dhaka
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartcampaign_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcampaign_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/code
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - ADMIN_REGISTRATION_SECRET=${ADMIN_REGISTRATION_SECRET:?ADMIN_REGISTRATION_SECRET is required}
      - TRACKING_BASE_URL=${TRACKING_BASE_URL:?TRACKING_BASE_URL is required}
      - TZ=Asia/Dhaka
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcampaign_worker
    restart: always
    command: celery -A app.tasks.email_sender.celery worker --loglevel=info
    volumes:
      - ./backend:/code
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - ADMIN_REGISTRATION_SECRET=${ADMIN_REGISTRATION_SECRET:?ADMIN_REGISTRATION_SECRET is required}
      - TRACKING_BASE_URL=${TRACKING_BASE_URL:?TRACKING_BASE_URL is required}
      - TZ=Asia/Dhaka
    depends_on:
      - db
      - redis

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcampaign_beat
    restart: always
    command: celery -A app.tasks.email_sender.celery beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./backend:/code
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - ADMIN_REGISTRATION_SECRET=${ADMIN_REGISTRATION_SECRET:?ADMIN_REGISTRATION_SECRET is required}
      - TRACKING_BASE_URL=${TRACKING_BASE_URL:?TRACKING_BASE_URL is required}
      - TZ=Asia/Dhaka
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcampaign_frontend
    restart: always
    ports:
      - "80:80"
    environment:
      - TZ=Asia/Dhaka
    depends_on:
      - backend

# Local host-bound folder mapping is used, no named volumes required.
