version: '3.8'

# ============================================================
#  PRODUCTION docker-compose — SmartCampaign SaaS
#  Usage: docker-compose -f docker-compose.prod.yml up -d
#
#  BEFORE DEPLOYING: Replace ALL placeholder values below
#  marked with  <-- CHANGE THIS
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: smartcampaign_db
    restart: always
    environment:
      POSTGRES_DB: smartcampaign
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Dhaka
    # NO external port — DB only accessible inside Docker network
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d smartcampaign"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartcampaign_redis
    restart: always
    # Password-protected Redis + NO external port
    command: redis-server --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcampaign_backend
    restart: always
    # PRODUCTION: no --reload flag
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/smartcampaign
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TRACKING_BASE_URL=${TRACKING_BASE_URL}
      - ENVIRONMENT=production
      - TZ=Asia/Dhaka
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcampaign_worker
    restart: always
    command: celery -A app.tasks.email_sender.celery worker --loglevel=warning --concurrency=4
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/smartcampaign
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TRACKING_BASE_URL=${TRACKING_BASE_URL}
      - ENVIRONMENT=production
      - TZ=Asia/Dhaka
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcampaign_beat
    restart: always
    command: celery -A app.tasks.email_sender.celery beat --loglevel=warning
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/smartcampaign
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TRACKING_BASE_URL=${TRACKING_BASE_URL}
      - ENVIRONMENT=production
      - TZ=Asia/Dhaka
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcampaign_frontend
    restart: always
    expose:
      - "80"
    environment:
      - TZ=Asia/Dhaka
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
